    <!-- Page Specific Styles (Aligned with the Premium Design Language) -->
    <style>
        /* CSS Variables & Section Padding */
        .careers-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        
        .careers-section {
            padding: 4rem 0;
            position: relative;
        }

        .careers-section-dark {
            background-color: var(--deep-navy);
            color: var(--white);
            border-radius: 8px;
            margin: 4rem 1.5rem;
            padding: 5rem 3rem;
            border: 1px solid rgba(184, 142, 82, 0.3);
            box-shadow: var(--shadow-lux);
        }

        /* Hero Section Split Layout */
        .careers-hero-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding-top: 130px;
            padding-bottom: 4rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .careers-hero-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .careers-hero-title {
            font-family: var(--font-heading);
            font-size: clamp(2.2rem, 2rem + 1vw, 2.75rem);
            line-height: 1.2;
            color: var(--deep-navy);
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        .careers-hero-desc {
            font-family: var(--font-body);
            font-size: 1.15rem;
            line-height: 1.65;
            color: var(--muted-slate);
            margin-bottom: 2.25rem;
        }

        .careers-hero-buttons {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            width: 100%;
        }

        .careers-hero-buttons .sd-btn-gold,
        .careers-hero-buttons .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 52px;
            padding: 0 2rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 2px !important;
            transition: var(--transition-fast);
            cursor: pointer;
            text-decoration: none;
        }

        .careers-hero-buttons .btn-secondary {
            border: 1px solid var(--deep-navy);
            background: transparent;
            color: var(--deep-navy);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .careers-hero-buttons .btn-secondary:hover {
            background: var(--deep-navy);
            color: var(--white);
            transform: translateY(-2px);
        }

        /* Abstract Collaboration Illustration (Right Side) */
        .careers-hero-illustration {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 420px;
        }

        .illustration-bg {
            position: absolute;
            width: 85%;
            height: 85%;
            background: radial-gradient(circle, rgba(184, 142, 82,0.08) 0%, rgba(251, 246, 243, 0) 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .careers-svg-art {
            width: 90%;
            height: auto;
            z-index: 2;
            filter: drop-shadow(0 12px 28px rgba(24, 42, 61,0.06));
        }

        /* Floating Badges */
        .floating-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(184, 142, 82, 0.25);
            border-radius: 8px;
            padding: 10px 16px;
            display: flex;
