<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><span class="brand-inline-text">acre&amp;key</span> Cursor System Presentation</title>
<style>
    :root {
        --obsidian-navy: #101C28;
        --warm-white: #F7F5F0;
        --muted-terracotta: #9B6248;
        --cursor-size: 32px;
        --border-weight: 1px;
    }

    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        cursor: none; /* Hide default cursor */
        overflow-x: hidden;
    }

    /* Presentation Layout */
    .presentation-container {
        display: flex;
        height: 100vh;
        width: 100vw;
    }

    .panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        position: relative;
    }

    .panel.dark {
        background-color: var(--obsidian-navy);
        color: var(--warm-white);
    }

    .panel.light {
        background-color: var(--warm-white);
        color: var(--obsidian-navy);
    }

    /* Demo Interaction Elements */
    .demo-item {
        padding: 20px 40px;
        border: 1px solid currentColor;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        position: relative;
        z-index: 10;
    }

    .demo-item::before {
        content: attr(data-type);
        position: absolute;
        top: -24px;
        left: 0;
        font-size: 9px;
        opacity: 0.5;
    }

    /* CURSOR SYSTEM */
    #custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--cursor-size);
        height: var(--cursor-size);
        pointer-events: none;
        z-index: 9999;
        /* Center the cursor precisely */
        transform: translate(-50%, -50%);
        mix-blend-mode: normal;
    }

    /* The Center Point */
    .cursor-dot {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 3px;
        height: 3px;
        background-color: var(--muted-terracotta);
        border-radius: 50%;
        transition: opacity 0.25s ease;
    }

    /* The Precision Frame Container */
    .cursor-frame {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    width 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Frame Brackets */
    .bracket {
        position: absolute;
        width: 8px;
        height: 8px;
        border-color: currentColor;
        border-style: solid;
        transition: border-width 0.25s ease;
    }

    .bracket.tl { top: 0; left: 0; border-width: var(--border-weight) 0 0 var(--border-weight); }
    .bracket.tr { top: 0; right: 0; border-width: var(--border-weight) var(--border-weight) 0 0; }
    .bracket.bl { bottom: 0; left: 0; border-width: 0 0 var(--border-weight) var(--border-weight); }
    .bracket.br { bottom: 0; right: 0; border-width: 0 var(--border-weight) var(--border-weight) 0; }

    /* Cursor Text Label */
    .cursor-label {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: currentColor;
        opacity: 0;
        white-space: nowrap;
        transition: opacity 0.2s ease, bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* THEME COLORS (Set via JS based on background) */
    #custom-cursor.theme-light { color: var(--obsidian-navy); }
    #custom-cursor.theme-dark { color: var(--warm-white); }

    /* ========================================= */
    /* HOVER STATES                              */
    /* ========================================= */

    /* 1. PROPERTY / IMAGE HOVER (INSPECT) */
    #custom-cursor.hover-inspect .cursor-frame {
        transform: scale(1.3);
    }
    #custom-cursor.hover-inspect .cursor-label {
        opacity: 1;
        bottom: -24px; /* pushed down due to scale */
    }

    /* 2. PROJECT HOVER (EXPLORE) */
    #custom-cursor.hover-explore .cursor-frame {
        transform: scale(1.15);
    }
    #custom-cursor.hover-explore .cursor-label {
        opacity: 1;
        bottom: -22px;
    }

    /* 3. PRIMARY CTA HOVER (DISCOVER) */
    #custom-cursor.hover-discover .cursor-frame {
        transform: scale(0.9) rotate(45deg);
    }
    #custom-cursor.hover-discover .bracket {
        /* slightly thicker for CTA */
        width: 10px; height: 10px;
    }
    #custom-cursor.hover-discover .cursor-label {
        opacity: 1;
        bottom: -26px; /* compensate for rotation bounds */
    }

    /* 4. GALLERY HOVER (DRAG) */
    #custom-cursor.hover-drag .cursor-frame {
        width: 60px; /* Horizontal framing */
        height: 20px;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
    }
    #custom-cursor.hover-drag .cursor-dot {
        opacity: 0.3;
    }
    #custom-cursor.hover-drag .cursor-label {
        opacity: 1;
        bottom: -18px;
    }
</style>
</head>
<body>

<div class="presentation-container">
    <!-- Dark Side -->
    <div class="panel dark" id="panel-dark">
        <h2 style="font-weight: 300; font-size: 16px; letter-spacing: 0.1em;">Obsidian Navy</h2>
        
        <div class="demo-item" data-type="Property/Image" data-cursor="inspect">
            Hover: Property Photo
        </div>
        
        <div class="demo-item" data-type="Primary CTA" data-cursor="discover">
            Book Advisory Call
        </div>
        
        <div class="demo-item" style="width: 200px; height: 100px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(247,245,240,0.3);" data-type="Gallery" data-cursor="drag">
            Gallery Area
        </div>
    </div>

    <!-- Light Side -->
    <div class="panel light" id="panel-light">
        <h2 style="font-weight: 300; font-size: 16px; letter-spacing: 0.1em;">Warm White</h2>
        
        <div class="demo-item" data-type="Project" data-cursor="explore">
            Hover: Project Card
        </div>
        
        <div class="demo-item" data-type="Primary CTA" data-cursor="discover">
            Evaluate Target Corridor
        </div>
        
        <div class="demo-item" style="width: 200px; height: 100px; display: flex; align-items: center; justify-content: center; border: 1px dashed rgba(16,28,40,0.3);" data-type="Gallery" data-cursor="drag">
            Gallery Area
        </div>
    </div>
</div>

<!-- Cursor DOM Elements -->
<div id="custom-cursor" class="theme-dark">
    <div class="cursor-frame">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>
    </div>
    <div class="cursor-dot"></div>
    <div class="cursor-label" id="cursor-label"></div>
</div>

<script>
    const cursor = document.getElementById('custom-cursor');
    const label = document.getElementById('cursor-label');
    
    // Physics variables for smooth lag (Lerp)
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let cursorX = mouseX;
    let cursorY = mouseY;
    
    // The easing factor (lower is slower/more lag)
    const speed = 0.2;

    // Track mouse position
    window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        // Detect theme based on x position (for presentation purposes)
        if (mouseX < window.innerWidth / 2) {
            cursor.classList.remove('theme-light');
            cursor.classList.add('theme-dark');
        } else {
            cursor.classList.remove('theme-dark');
            cursor.classList.add('theme-light');
        }
    });

    // Render loop
    function animate() {
        // Lerp equation: current = current + (target - current) * speed
        cursorX += (mouseX - cursorX) * speed;
        cursorY += (mouseY - cursorY) * speed;
        
        // Apply position
        cursor.style.transform = `translate(${cursorX}px, ${cursorY}px)`;
        
        requestAnimationFrame(animate);
    }
    
    animate();

    // Hover state management
    const interactables = document.querySelectorAll('[data-cursor]');
    
    interactables.forEach(el => {
        el.addEventListener('mouseenter', () => {
            const state = el.getAttribute('data-cursor');
            
            // Map state to label text
            let labelText = '';
            if (state === 'inspect') labelText = 'Inspect';
            if (state === 'explore') labelText = 'Explore';
            if (state === 'discover') labelText = 'Discover';
            if (state === 'drag') labelText = 'Drag';
            
            label.textContent = labelText;
            cursor.classList.add(`hover-${state}`);
        });
        
        el.addEventListener('mouseleave', () => {
            const state = el.getAttribute('data-cursor');
            cursor.classList.remove(`hover-${state}`);
        });
    });
</script>
</body>
</html>
