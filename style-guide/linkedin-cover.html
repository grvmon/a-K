<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acre&Key — LinkedIn Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Marcellus&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian-black: #0A0A0B;
            --titanium-frost: #FAFAFA;
        }
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* 1128 x 191 Canvas — no box-shadow per style guide Zero Shadow rule */
        .cover-canvas {
            position: relative;
            width: 1128px;
            height: 191px;
            background-color: var(--obsidian-black);
            overflow: hidden;
        }

        /* Left Side: Architecture */
        .cover-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 70%;
            height: 100%;
        }
        
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 60%;
            filter: saturate(0.85) contrast(1.05);
        }

        /* Gradient mask fades architecture into the right typography zone */
        .gradient-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to left, rgba(10,10,11,0.78) 0%, rgba(10,10,11,0.4) 30%, rgba(10,10,11,0.1) 55%, rgba(10,10,11,0) 100%);
        }

        /* Right Side: Typography (Safe Area: X 550-1028, Y 50-141) */
        .typography-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 550px;
            height: 100%;
            padding-right: 100px;
            padding-left: 40px;
            padding-top: 50px;
            padding-bottom: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
            z-index: 10;
        }

        /* Typography Hierarchy */
        .h1-primary {
            font-family: 'Marcellus', serif;
            font-size: 36px;
            color: var(--titanium-frost);
            margin: 0 0 12px 0;
            line-height: 1;
            letter-spacing: -0.01em;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
        }

        .brand-logo {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 24px;
            color: var(--titanium-frost);
            margin: 0;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .brand-descriptor {
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: rgba(250, 250, 250, 0.75);
            text-transform: none;
            letter-spacing: 0.05em;
            border-left: 0.5px solid rgba(250,250,250,0.25);
            padding-left: 16px;
            line-height: 1.4;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div class="cover-canvas">
        <div class="cover-image-container">
            <img class="cover-img" src="assets/images/moodboard/frame1_3x4.jpg" alt="Architecture">
            <div class="gradient-mask"></div>
        </div>
        
        <div class="typography-zone">
            <h1 class="h1-primary">Buying a home?</h1>
            
            <div class="brand-lockup">
                <div class="brand-logo">acre&key</div>
                <div class="brand-descriptor">Home-buying concierge.</div>
            </div>
        </div>
    </div>

</body>
</html>
