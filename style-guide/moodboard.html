<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acre&Key Moodboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --cta-gradient: linear-gradient(135deg, #be7555 0%, #9f5334 100%);
            --text-copper-aaa: #804526;
            --titanium-frost: #FAFAFA;
            --obsidian-black: #1C1C1E;
            --neutral-grey: #55555A;
        }
        body {
            margin: 0;
            background-color: var(--obsidian-black);
            font-family: 'Manrope', sans-serif;
            color: var(--titanium-frost);
        }
        .mood-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 4rem;
        }
        .mood-shot {
            position: relative;
            width: 100%;
            height: 80vh;
            border-radius: 4px;
            overflow: hidden;
            background: #111;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .mood-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Rule 5: Cinematic Desaturation */
            filter: saturate(0.85) contrast(1.05);
        }
        .mood-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Rule 11: The Anchored Gradient Rule */
            background: linear-gradient(to top, rgba(10, 10, 11,0.95) 0%, rgba(10, 10, 11,0) 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem;
            box-sizing: border-box;
        }
        .mood-text {
            font-family: 'Marcellus', serif;
            font-size: clamp(2rem, 1.5rem + 2vw, 3rem);
            font-weight: 400;
            color: var(--titanium-frost);
            margin: 0;
            line-height: 1.1;
        }
        .mood-subtext {
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            color: rgba(250, 250, 250, 0.7);
            margin-top: 1rem;
            max-width: 600px;
        }
        .mood-brand {
            font-family: 'Marcellus', serif;
            font-size: 2rem;
            color: var(--titanium-frost);
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="mood-container">
        <!-- Shot 1 -->
        <div class="mood-shot">
            <img class="mood-img" src="/Users/gauravmongia/.gemini/antigravity/brain/65b24d7e-1543-41a1-bb3a-a3103a0e449b/bg_entrance_1790793477474.jpg" alt="Luxury Entrance">
            <div class="mood-overlay">
                <h1 class="mood-text">Buying a home?</h1>
            </div>
        </div>

        <!-- Shot 2 -->
        <div class="mood-shot">
            <img class="mood-img" src="/Users/gauravmongia/.gemini/antigravity/brain/65b24d7e-1543-41a1-bb3a-a3103a0e449b/bg_forms_1790793487968.jpg" alt="Architectural Forms">
            <div class="mood-overlay">
                <h1 class="mood-text">We help you buy right.</h1>
            </div>
        </div>

        <!-- Shot 3 -->
        <div class="mood-shot">
            <img class="mood-img" src="/Users/gauravmongia/.gemini/antigravity/brain/65b24d7e-1543-41a1-bb3a-a3103a0e449b/bg_composite_1790793498485.jpg" alt="Diligence Flatlay">
            <div class="mood-overlay">
                <h1 class="mood-text">Find. Check. Inspect. Negotiate.</h1>
            </div>
        </div>

        <!-- Shot 4 -->
        <div class="mood-shot">
            <img class="mood-img" src="/Users/gauravmongia/.gemini/antigravity/brain/65b24d7e-1543-41a1-bb3a-a3103a0e449b/bg_interior_1790793510442.jpg" alt="Hero Interior">
            <div class="mood-overlay" style="align-items: center; text-align: center; justify-content: center; background: rgba(10,10,11,0.6);">
                <div class="mood-brand">acre&key</div>
                <div class="mood-subtext" style="color:var(--titanium-frost); text-transform:uppercase; letter-spacing:0.15em; font-weight:600; font-size:0.8rem; margin: 0 0 2rem 0;">Independent home-buying concierge.</div>
                <h1 class="mood-text" style="font-size:clamp(3rem, 2rem + 3vw, 5rem);">You Decide.</h1>
                <div class="mood-subtext" style="margin-top: 2rem;">acrenkey.com</div>
            </div>
        </div>
    </div>
</body>
</html>
