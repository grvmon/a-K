<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreNKey — Ultra-HNI Visual Moodboard (3:4)</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marcellus&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cta-gradient: linear-gradient(135deg, #be7555 0%, #9f5334 100%);
            --text-copper-aaa: #804526;
            --titanium-frost: #FAFAFA;
            --obsidian-black: #0A0A0B;
            --neutral-grey: #55555A;
        }
        
        body {
            margin: 0;
            background-color: var(--obsidian-black);
            font-family: 'Manrope', sans-serif;
            color: var(--titanium-frost);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 4rem;
            padding: 4rem 2rem;
        }
        .frame {
            position: relative;
            /* Scaled down to 50% for preview (540x675). Export scripts will still render correctly based on aspect ratio or override. */
            width: 100%;
            max-width: 600px; /* Reduced from 1200px so it fits on screen visually */
            aspect-ratio: 1080 / 1350;
            overflow: hidden;
            background: #000;
            container-type: inline-size;
        }
        
        .frame-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.85) contrast(1.05);
            /* Cinematic Slow Zoom */
            transform: scale(1.01);
            transition: transform 1s ease-out;
            animation: slowPan 25s ease-in-out infinite alternate;
        }
        @keyframes slowPan {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.08); }
        }
        .frame-text, .brand-logo-josefin, .brand-sub {
            /* Editorial Crispness */
            text-shadow: 0 4px 32px rgba(0,0,0,0.5);
        }

        
        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* QC Fix: Restored 0.95 opacity specifically behind the text safe zone (0-30%), then fading quickly to 0% by the middle (50%) to keep the image visible */
            background: linear-gradient(to top, rgba(10, 10, 11, 0.95) 0%, rgba(10, 10, 11, 0.85) 30%, rgba(10, 10, 11, 0) 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            /* Typography Safe Zone (15% vertical ensures safety in 1:1 grid) */
            padding-top: 15%;
            padding-bottom: 15%;
            padding-left: 10%;
            padding-right: 10%;
            box-sizing: border-box;
        }

        .frame-text {
            font-family: 'Marcellus', serif;
            font-size: 6.5cqw; /* Scales perfectly with width to stay on 1 line */
            font-weight: 400;
            color: var(--titanium-frost);
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
            white-space: nowrap; /* Force one line */
        }
        .center-overlay {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 11, 0.4);
        }
        
        .brand-logo-josefin {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 15cqw; /* Significantly increased to make acre&key text bigger */
            color: var(--titanium-frost);
            margin: 0 0 1.5cqw 0;
            letter-spacing: -0.02em;
        }

        .brand-logo {
            font-family: 'Marcellus', serif;
            font-size: 8cqw;
            color: var(--titanium-frost);
            
        }
        .brand-sub {
            font-family: 'Manrope', sans-serif;
            font-size: 4.5cqw; /* Increased to balance the massive 15cqw logo above it */
            color: rgba(250, 250, 250, 0.85); /* Slightly brightened */
            text-transform: none; /* Changed from uppercase */
            letter-spacing: 0.03em; /* Tightened from 0.15em */
            font-weight: 500; /* Increased weight for better presence */
        }

    
        
        
        
        /* Carousel Navigation */
        .carousel-nav-container {
            position: absolute;
            bottom: 10%; /* 160px from bottom (Critical Safe Area) */
            left: 10%; /* 120px from left */
            right: 10%; /* 120px from right */

            height: 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .carousel-dots {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .carousel-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
        }
        .carousel-dot.active {
            background-color: rgba(255, 255, 255, 0.9);
        }
        .carousel-arrow-right {
            width: 48px;
            height: 48px;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.4s ease;
            cursor: pointer;
        }
        .carousel-arrow-right:hover {
            transform: translateX(5px);
        }



    </style>
</head>
<body>

    <!-- 01 -->
    <div class="frame">
        <img class="frame-img" src="assets/riviera/riviera_villa_exterior.webp" alt="01">
        <div class="frame-overlay">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <h1 class="frame-text">Buying a home?</h1>
                
        <svg class="carousel-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; color: rgba(255, 255, 255, 0.9); cursor: pointer; transition: transform 0.4s ease; ">
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <polyline points="15 5 22 12 15 19"></polyline>
        </svg>
    
            </div>
        </div>
    </div>

    <!-- 02 -->
    <div class="frame">
        <img class="frame-img" src="assets/riviera/riviera_luna_villa.webp" alt="02">
        <div class="frame-overlay">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <h1 class="frame-text">We help you buy right.</h1>
                
        <svg class="carousel-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; color: rgba(255, 255, 255, 0.9); cursor: pointer; transition: transform 0.4s ease; ">
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <polyline points="15 5 22 12 15 19"></polyline>
        </svg>
    
            </div>
        </div>
    </div>

    <!-- 03 -->
    <div class="frame">
        <img class="frame-img" src="assets/images/moodboard/frame3_3x4.jpg" alt="03">
        <div class="frame-overlay" style="background: rgba(10, 10, 11, 0.85);">
            <h1 class="frame-text" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); white-space: normal; text-align: left; line-height: 1.25; width: fit-content; margin: 0;">
                <strong style="font-weight: bold;">F</strong>ind.<br>
                <strong style="font-weight: bold;">I</strong>nspect.<br>
                <strong style="font-weight: bold;">N</strong>egotiate.<br>
                <strong style="font-weight: bold;">D</strong>ecide.
            </h1>
            <div style="display: flex; justify-content: flex-end; align-items: center; width: 100%;">
                
        <svg class="carousel-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" style="width: 48px; height: 48px; color: rgba(255, 255, 255, 0.9); cursor: pointer; transition: transform 0.4s ease; ">
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <polyline points="15 5 22 12 15 19"></polyline>
        </svg>
    
            </div>
        </div>
    </div>

    <!-- 04 -->
    <div class="frame">
        <img class="frame-img" src="assets/images/moodboard/frame5_3x4.jpg" alt="04">
        <div class="frame-overlay center-overlay">
            <div class="brand-logo-josefin" style="">acre&key</div>
            <div class="brand-sub">Home Buying Concierge</div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.carousel-arrow-right').forEach((arrow, index) => {
            arrow.addEventListener('click', () => {
                const frames = document.querySelectorAll('.frame');
                if (frames[index + 1]) {
                    frames[index + 1].scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
