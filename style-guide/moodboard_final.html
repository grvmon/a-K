<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcreNKey — Ultra-HNI Visual Moodboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        :root {
            --cta-gradient: linear-gradient(135deg, #be7555 0%, #9f5334 100%);
            --text-copper-aaa: #804526;
            --titanium-frost: #FAFAFA;
            --obsidian-black: #0A0A0B;
            --neutral-grey: #55555A;
        }
        body {
            margin: 0;
            background-color: var(--obsidian-black);
            font-family: 'Manrope', sans-serif;
            color: var(--titanium-frost);
            scroll-behavior: smooth;
            scroll-snap-type: y mandatory;
        }
        .frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            scroll-snap-align: start;
            overflow: hidden;
            background: #000;
        }
        .frame-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.85) contrast(1.05); /* Unified Cinematic Grade */
            opacity: 0.95;
        }
        .frame-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 7AAA Anchored Gradient */
            background: linear-gradient(to top, rgba(10, 10, 11, 0.95) 0%, rgba(10, 10, 11, 0.85) 35%, rgba(10, 10, 11, 0) 70%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 4rem 10vw;
            box-sizing: border-box;
        }
        .frame-text {
            font-family: 'Marcellus', serif;
            font-size: clamp(2.5rem, 2rem + 3vw, 4.5rem);
            font-weight: 400;
            color: var(--titanium-frost);
            margin: 0;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }
        .center-overlay {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(10, 10, 11, 0.75);
        }
        .brand-logo {
            font-family: 'Marcellus', serif;
            font-size: clamp(3rem, 2rem + 3vw, 4rem);
            color: var(--titanium-frost);
            margin-bottom: 0.5rem;
        }
        .brand-sub {
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            color: rgba(250, 250, 250, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }
        .meta-label {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-family: 'Manrope', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: rgba(250,250,250,0.5);
        }
    </style>
</head>
<body>

    <!-- 01 -->

            <div class="meta-label">01 — The Decision</div>
