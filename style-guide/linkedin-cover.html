<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acre&Key — LinkedIn Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Marcellus&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --obsidian-black: #1C1C1E;
            --titanium-frost: #FAFAFA;
        }
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* 1128 x 191 Canvas — no box-shadow per style guide Zero Shadow rule */
        .cover-canvas {
            position: relative;
            width: 1128px;
            height: 191px;
            background-color: var(--obsidian-black);
            overflow: hidden;
        }

        /* Left Side: Architecture */
        .cover-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; /* FIXED: Was 70%, causing the harsh black band on the right */
            height: 100%;
        }
        
        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Focus on the top/middle of the house to show the balcony and roof, avoiding the driveway */
            object-position: center 25%;
            filter: saturate(0.85) contrast(1.05);
        }

        /* Gradient mask fades architecture into the right typography zone */
        .gradient-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 90% opacity behind the text (0% to 45%), fading out into the house */
            background: linear-gradient(to left, rgba(10,10,11,0.9) 0%, rgba(10,10,11,0.9) 45%, rgba(10,10,11,0) 80%);
        }

        /* Luxury 35mm Film Grain Overlay */
        .cover-image-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.12;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 5;
        }

        /* Right Side: Typography (Safe Area: X 578-1028, Y 50-141) */
        .typography-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 500px;
            height: 100%;
            padding-right: 80px;
            padding-left: 40px;
            padding-top: 50px;
            padding-bottom: 50px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            text-align: left;
            z-index: 10;
        }

        /* Typography Hierarchy: 18 > 19 > 34 */
        .h1-primary {
            font-family: 'Manrope', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: rgba(250, 250, 250, 0.82); /* AAA fix: ~8.5:1 contrast */
            margin: 0 0 8px 0;
            line-height: 1;
            letter-spacing: 0.04em;
        }

        .p-secondary {
            font-family: 'Marcellus', serif;
            font-size: 19px;
            font-weight: 400;
            color: rgba(250, 250, 250, 0.85);
            margin: 0 0 12px 0;
            letter-spacing: 0.02em;
            white-space: nowrap;
            line-height: 1;
        }

        .brand-lockup {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
        }

        .brand-logo {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 34px;
            color: var(--titanium-frost);
            margin: 0;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .brand-descriptor {
            font-family: 'Manrope', sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: rgba(250, 250, 250, 0.75); /* AAA fix: ~8.5:1 contrast */
            text-transform: none;
            letter-spacing: 0.03em;
            border-left: 0.5px solid rgba(250,250,250,0.2);
            padding-left: 12px;
            line-height: 1.3;
            white-space: nowrap;
        }
    </style>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
</head>
<body>

    <div class="cover-canvas">
        <div class="cover-image-container">
            <img class="cover-img" src="assets/riviera/riviera_sol_villa.webp" alt="Ultra Luxury Villa Bengaluru">
            <div class="gradient-mask"></div>
        </div>
        
        <div class="typography-zone">
            <h1 class="h1-primary">Buying a home in Bengaluru?</h1>
            <p class="p-secondary"><strong style="font-weight: bold;">F</strong>ind. <strong style="font-weight: bold;">I</strong>nspect. <strong style="font-weight: bold;">N</strong>egotiate. <strong style="font-weight: bold;">D</strong>ecide.</p>
            
            <div class="brand-lockup">
                <div class="brand-logo">acre&key</div>
                <div class="brand-descriptor">Home Buying Concierge</div>
            </div>
        </div>
    </div>

</body>
</html>
