<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads Campaign – acre&key</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marcellus&family=Josefin+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --titanium-frost: #FAFAFA;
        --obsidian-black: #0A0A0B;
    }

    body {
        background-color: var(--obsidian-black);
        font-family: 'Manrope', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 4rem 2rem;
    }

    .frame-container {
        width: 100%;
        max-width: 540px;
        aspect-ratio: 1080 / 1350;
        position: relative;
        border-radius: 4px;
        border: 0.5px solid rgba(85, 85, 90, 0.2);
        overflow: hidden;
        container-type: inline-size;
    }

    .frame-img {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        object-fit: cover;
    }

    .frame-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        /* Adjusted gradient to cover slightly more so all text fits */
        background: linear-gradient(to top, rgba(10, 10, 11, 0.95) 0%, rgba(10, 10, 11, 0.85) 60%, rgba(10, 10, 11, 0) 80%);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 10cqw 10cqw 15cqw 10cqw;
        box-sizing: border-box;
    }

    .headline {
        font-family: 'Marcellus', serif;
        font-size: 7.4cqw;
        font-weight: 400;
        color: var(--titanium-frost);
        margin: 0 0 4cqw 0;
        line-height: 1.1;
        letter-spacing: -0.02em;
        white-space: nowrap;
    }

    .find-block {
        display: flex;
        flex-direction: column;
        gap: 0.5cqw;
        margin-bottom: 6cqw;
    }

    .we-help-you {
        font-family: 'Marcellus', serif;
        font-size: 3.5cqw;
        font-weight: 400;
        color: rgba(250, 250, 250, 0.85);
        margin-bottom: 1.5cqw;
    }

    .find-item {
        font-family: 'Marcellus', serif;
        font-size: 6cqw;
        font-weight: 400;
        color: rgba(250, 250, 250, 0.95);
        line-height: 1.1;
    }
    .find-item strong {
        font-weight: bold;
    }

    .bottom-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .brand-logo-josefin {
        font-family: 'Josefin Sans', sans-serif;
        font-size: 8cqw;
        color: var(--titanium-frost);
        margin: 0 0 0.5cqw 0;
        letter-spacing: -0.02em;
    }
    .brand-sub {
        font-family: 'Manrope', sans-serif;
        font-size: 3cqw;
        color: rgba(250, 250, 250, 0.85);
        letter-spacing: 0.03em;
        font-weight: 500;
    }

</style>
</head>
<body>

    <div class="frame-container">
        <img class="frame-img" src="assets/images/moodboard/frame5_3x4.jpg" alt="Background">
        <div class="frame-overlay">
            
            <h1 class="headline">Buying a home in Bengaluru?</h1>

            <div class="find-block">
                <div class="we-help-you">We help you</div>
                <div class="find-item"><strong>F</strong>ind</div>
                <div class="find-item"><strong>I</strong>nspect</div>
                <div class="find-item"><strong>N</strong>egotiate</div>
                <div class="find-item"><strong>D</strong>ecide</div>
            </div>

            <div class="bottom-block">
                <div class="brand-logo-josefin">acre&key</div>
                <div class="brand-sub">Home Buying Concierge</div>
            </div>

        </div>
    </div>

</body>
</html>
