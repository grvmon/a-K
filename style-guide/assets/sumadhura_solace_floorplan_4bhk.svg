<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#FAF6F3" rx="8"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9E2D7" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid2)" />

  <!-- Outer Walls -->
  <rect x="80" y="60" width="640" height="480" fill="none" stroke="#1F2B38" stroke-width="8" rx="4"/>

  <!-- Foyer / Grand Living / Dining -->
  <rect x="80" y="60" width="380" height="260" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="270" y="170" font-family="Manrope, sans-serif" font-size="20" font-weight="700" fill="#1F2B38" text-anchor="middle">GRAND LIVING & DINING</text>
  <text x="270" y="198" font-family="Manrope, sans-serif" font-size="14" fill="#B88E52" text-anchor="middle">26&#39; 0" x 16&#39; 6"</text>

  <!-- Double Width Balcony -->
  <rect x="80" y="320" width="380" height="90" fill="#FAF0E6" stroke="#1F2B38" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="270" y="370" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#B88E52" text-anchor="middle">WRAPAROUND TWIN LAKE BALCONY</text>

  <!-- Master Suite -->
  <rect x="460" y="60" width="260" height="230" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="590" y="160" font-family="Manrope, sans-serif" font-size="17" font-weight="700" fill="#1F2B38" text-anchor="middle">MASTER SUITE</text>
  <text x="590" y="185" font-family="Manrope, sans-serif" font-size="13" fill="#B88E52" text-anchor="middle">16&#39; 0" x 14&#39; 0" + DRESSER</text>

  <!-- Bedroom 2 & 3 -->
  <rect x="460" y="290" width="260" height="120" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="590" y="345" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">BEDROOM 2 & 3</text>

  <!-- Bedroom 4 / Servant / Study -->
  <rect x="80" y="410" width="240" height="130" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="200" y="470" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">BEDROOM 4 / STUDY</text>

  <!-- Island Kitchen & Maid Room -->
  <rect x="320" y="410" width="200" height="130" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="420" y="470" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">ISLAND KITCHEN</text>

  <!-- Ensuite Bathrooms -->
  <rect x="520" y="410" width="200" height="130" fill="#FAF6F3" stroke="#1F2B38" stroke-width="4"/>
  <text x="620" y="470" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#1F2B38" text-anchor="middle">4 ENSUITE BATHS</text>

  <!-- Title Badge -->
  <rect x="100" y="80" width="150" height="32" fill="#1F2B38" rx="4"/>
  <text x="175" y="101" font-family="Marcellus, serif" font-size="14" fill="#B88E52" text-anchor="middle">4 BHK LUXURY</text>
</svg>