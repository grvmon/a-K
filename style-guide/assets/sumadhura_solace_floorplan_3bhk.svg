<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#FAF6F3" rx="8"/>
  <!-- Grid background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9E2D7" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)" />
  
  <!-- Outer Walls -->
  <rect x="100" y="80" width="600" height="440" fill="none" stroke="#1F2B38" stroke-width="8" rx="4"/>
  
  <!-- Foyer / Living Room -->
  <rect x="100" y="80" width="320" height="240" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="260" y="180" font-family="Manrope, sans-serif" font-size="18" font-weight="700" fill="#1F2B38" text-anchor="middle">LIVING & DINING</text>
  <text x="260" y="205" font-family="Manrope, sans-serif" font-size="13" fill="#B88E52" text-anchor="middle">22&#39; 6" x 14&#39; 0"</text>

  <!-- Balcony -->
  <rect x="100" y="320" width="320" height="80" fill="#FAF0E6" stroke="#1F2B38" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="260" y="365" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#B88E52" text-anchor="middle">LAKE VIEW BALCONY (7&#39; WIDE)</text>

  <!-- Master Bedroom + Dresser + Toilet -->
  <rect x="420" y="80" width="280" height="200" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="560" y="160" font-family="Manrope, sans-serif" font-size="16" font-weight="700" fill="#1F2B38" text-anchor="middle">MASTER BEDROOM</text>
  <text x="560" y="185" font-family="Manrope, sans-serif" font-size="13" fill="#B88E52" text-anchor="middle">14&#39; 0" x 12&#39; 6"</text>

  <!-- Bedroom 2 -->
  <rect x="420" y="280" width="280" height="120" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="560" y="335" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">BEDROOM 2</text>
  <text x="560" y="355" font-family="Manrope, sans-serif" font-size="12" fill="#667085" text-anchor="middle">12&#39; 0" x 11&#39; 0"</text>

  <!-- Bedroom 3 / Guest -->
  <rect x="100" y="400" width="240" height="120" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="220" y="455" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">BEDROOM 3</text>
  <text x="220" y="475" font-family="Manrope, sans-serif" font-size="12" fill="#667085" text-anchor="middle">11&#39; 6" x 11&#39; 0"</text>

  <!-- Kitchen & Utility -->
  <rect x="340" y="400" width="180" height="120" fill="#FFFFFF" stroke="#1F2B38" stroke-width="4"/>
  <text x="430" y="455" font-family="Manrope, sans-serif" font-size="15" font-weight="600" fill="#1F2B38" text-anchor="middle">KITCHEN & UTILITY</text>

  <!-- Toilets -->
  <rect x="520" y="400" width="180" height="120" fill="#FAF6F3" stroke="#1F2B38" stroke-width="4"/>
  <text x="610" y="455" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#1F2B38" text-anchor="middle">ENSUITE TOILETS</text>

  <!-- Title Badge -->
  <rect x="120" y="100" width="140" height="32" fill="#1F2B38" rx="4"/>
  <text x="190" y="121" font-family="Marcellus, serif" font-size="14" fill="#B88E52" text-anchor="middle">3 BHK LARGE</text>
</svg>